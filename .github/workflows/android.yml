name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon test

      # Blocking: any lint error fails the build, so nothing is published.
      - name: Lint (all modules)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Refuse a stable release without the private key
        if: env.IS_TAG == 'true' && env.HAS_UPLOAD_KEY != 'true'
        run: |
          echo "::error::Tag builds are stable releases and must be signed with the private upload key (secret UPLOAD_KEYSTORE_BASE64)."
          exit 1

      - name: Decode upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks" && echo "SONIC_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build test APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build signed release (APK + AAB)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          SONIC_REQUIRE_UPLOAD_KEY: 'true'
          SONIC_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SONIC_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SONIC_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Collect outputs with checksums
        run: |
          mkdir -p out
          short=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "out/SonicControl-test-${GITHUB_RUN_NUMBER}-${short}.apk"
          # Same file under a fixed name, so the download link never changes.
          cp app/build/outputs/apk/debug/app-debug.apk out/SonicControl-test.apk
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/SonicControl-${GITHUB_RUN_NUMBER}-${short}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "out/SonicControl-${GITHUB_RUN_NUMBER}-${short}.aab"
          fi
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Build: ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "SHA-256:"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: sonic-control-${{ github.run_number }}
          path: out/*

      # Test build only: signed with the public debug key, package com.soniccontrol.debug, marked pre-release.
      - name: Publish test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "TEST BUILD — not a stable release. Signed with the public debug key; installs as \"Sonic Control debug\" (com.soniccontrol.debug)."
            echo ""
            cat release-notes.md
          } > notes.md
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build out/* --prerelease --title "Sonic Control test build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --target "${GITHUB_SHA}"
          gh release delete latest --yes --cleanup-tag || true

      - name: Publish stable release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: out/*
